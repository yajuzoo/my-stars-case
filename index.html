    function checkFreeCooldown() {
      const lastOpen = localStorage.getItem('lastFreeCaseOpen');
      if (!lastOpen) return 0;
      const passed = Date.now() - parseInt(lastOpen);
      const remaining = (3600 * 1000) - passed;
      return remaining > 0 ? Math.ceil(remaining / (60 * 1000)) : 0;
    }

    function renderCases() {
      const freeCd = checkFreeCooldown();
      const grid = document.getElementById('casesGrid');
      grid.innerHTML = casesData.map(c => `
        <div class="case-card" onclick="openCaseDetails(${c.id})">
          ${c.id === 1 && freeCd > 0 ? `<div class="cooldown-badge">⏳ ${freeCd} мин</div>` : ''}
          <div class="case-icon">${c.icon}</div>
          <div class="case-title">${c.name}</div>
          <div class="case-price">${c.price > 0 ? c.price.toLocaleString() + ' ⭐' : 'БЕСПЛАТНО'}</div>
        </div>
      `).join('');
    }

    function openCaseDetails(id) {
      currentCase = casesData.find(x => x.id === id);
      
      if (currentCase.id === 1) {
        const cd = checkFreeCooldown();
        if (cd > 0) {
          alert(`⏱ Бесплатный кейс доступен раз в час! Подождите ещё ${cd} мин.`);
          return;
        }
      }

      document.getElementById('overlayCaseTitle').textContent = currentCase.name;

      const grid = document.getElementById('dropItemsGrid');
      grid.innerHTML = currentCase.items.map(it => `
        <div class="item-card">
          <div class="icon">${it.icon}</div>
          <div class="name">${it.name}</div>
          <div class="value">${it.value.toLocaleString()} ⭐</div>
        </div>
      `).join('');

      buildRouletteTrack();
      document.getElementById('caseOverlay').style.display = 'flex';
    }

    function buildRouletteTrack() {
      const track = document.getElementById('rouletteTrack');
      track.style.transition = 'none';
      track.style.transform = 'translateX(0px)';
      
      let html = '';
      for (let i = 0; i < 60; i++) {
        const item = currentCase.items[Math.floor(Math.random() * currentCase.items.length)];
        html += `
          <div class="roulette-item">
            <div class="icon">${item.icon}</div>
            <div>${item.name}</div>
          </div>
        `;
      }
      track.innerHTML = html;
    }

    function getWeightedDrop(items) {
      const totalWeight = items.reduce((sum, item) => sum + item.weight, 0);
      let rand = Math.random() * totalWeight;
      for (let item of items) {
        if (rand < item.weight) return item;
        rand -= item.weight;
      }
      return items[0];
    }

    function spinRoulette() {
      if (isSpinning) return;
      
      if (currentCase.id === 1) {
        const cd = checkFreeCooldown();
        if (cd > 0) {
          alert(`⏱ Задержка! Осталось ${cd} мин.`);
          return;
        }
      } else if (balance < currentCase.price) {
        alert("Недостаточно Звёзд на балансе!");
        openTopUpModal();
        return;
      }

      isSpinning = true;
      if (currentCase.price > 0) {
        balance -= currentCase.price;
        updateBalanceDisplay();
      } else {
        localStorage.setItem('lastFreeCaseOpen', Date.now().toString());
      }

      const winItem = getWeightedDrop(currentCase.items);
      const track = document.getElementById('rouletteTrack');
      
      // Сбрасываем ленту мгновенно в исходное положение без анимации
      track.style.transition = 'none';
      track.style.transform = 'translateX(0px)';

      // Заново генерируем рандомные элементы для свежей прокрутки
      let html = '';
      for (let i = 0; i < 60; i++) {
        const item = currentCase.items[Math.floor(Math.random() * currentCase.items.length)];
        html += `
          <div class="roulette-item">
            <div class="icon">${item.icon}</div>
            <div>${item.name}</div>
          </div>
        `;
      }
      track.innerHTML = html;

      // Ставим выигрышный предмет на 45-ю позицию
      const children = track.children;
      children[45].querySelector('.icon').textContent = winItem.icon;
      children[45].children[1].textContent = winItem.name;

      const itemWidth = 100; 
      const wrapperWidth = document.querySelector('.roulette-wrapper').clientWidth;
      const targetOffset = -(45 * itemWidth - (wrapperWidth / 2) + (itemWidth / 2));

      // Небольшая задержка перед запуском CSS-анимации движения
      setTimeout(() => {
        track.style.transition = 'transform 4.5s cubic-bezier(0.15, 0.9, 0.2, 1)';
        track.style.transform = `translateX(${targetOffset}px)`;
      }, 50);

      setTimeout(() => {
        isSpinning = false;
        inventory.push({ ...winItem, id: Date.now() });
        renderCases();
        alert(`🎉 Выбито: ${winItem.name}! Предмет добавлен в инвентарь.`);
      }, 4850);
    }

    function openProfile() {
      document.getElementById('invBalance').textContent = `${balance.toLocaleString()} ⭐`;
      renderInventory();
      document.getElementById('profileOverlay').style.display = 'flex';
    }

    function renderInventory() {
      const list = document.getElementById('inventoryList');
      if (inventory.length === 0) {
        list.innerHTML = `<p style="text-align:center; color:#717a8c; padding:10px;">Инвентарь пуст.</p>`;
        return;
      }
      list.innerHTML = inventory.map(item => `
        <div class="inv-item">
          <div style="display:flex; align-items:center; gap:10px;">
            <div style="font-size:26px;">${item.icon}</div>
            <div>
              <div style="font-weight:700; font-size:13px;">${item.name}</div>
              <div style="font-size:11px; color:#ffb703;">${item.value.toLocaleString()} ⭐</div>
            </div>
          </div>
          <button class="btn-sell" onclick="sellItem(${item.id})">Продать за ${item.value.toLocaleString()} ⭐</button>
        </div>
      `).join('');
    }

    function sellItem(id) {
      const idx = inventory.findIndex(x => x.id === id);
      if (idx !== -1) {
        const item = inventory[idx];
        balance += item.value;
        inventory.splice(idx, 1);
        updateBalanceDisplay();
        document.getElementById('invBalance').textContent = `${balance.toLocaleString()} ⭐`;
        renderInventory();
      }
    }

    async function requestWithdraw() {
      const amount = parseInt(document.getElementById('withdrawAmount').value);
      if (!amount || amount < 250) {
        alert("Минимальная сумма вывода — 250 ⭐!");
        return;
      }
      if (amount > balance) {
        alert("У вас недостаточно звёзд на балансе!");
        return;
      }

      try {
        const response = await fetch(`${SERVER_URL}/api/withdraw`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'ngrok-skip-browser-warning': 'true' },
          body: JSON.stringify({
            user_id: tgUserId,
            username: tg.initDataUnsafe?.user?.username || 'Без юзернейма',
            first_name: tg.initDataUnsafe?.user?.first_name || 'Игрок',
            amount: amount
          })
        });
        const data = await response.json();
        if (data.status === 'ok') {
          balance -= amount;
          updateBalanceDisplay();
          document.getElementById('invBalance').textContent = `${balance.toLocaleString()} ⭐`;
          document.getElementById('withdrawAmount').value = '';
          alert(`✅ Заявка на вывод ${amount.toLocaleString()} ⭐ принята!`);
        } else {
          alert("Ошибка отправки заявки.");
        }
      } catch (e) {
        alert("Ошибка сервера!");
      }
    }

    // --- ФУНКЦИИ АДМИН-ПАНЕЛИ ---
    async function openAdminPanel() {
      if (tgUserId !== ADMIN_ID) return;
      
      let adminModal = document.getElementById('adminModal');
      if (!adminModal) {
        adminModal = document.createElement('div');
        adminModal.id = 'adminModal';
        adminModal.className = 'overlay';
        adminModal.innerHTML = `
          <div class="modal-content" style="max-width: 450px;">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 15px;">
              <h3 style="margin:0;">🛠 Админ-панель</h3>
              <button onclick="closeModal('adminModal')" style="background:none; border:none; color:#fff; font-size:18px; cursor:pointer;">✕</button>
            </div>
            
            <div style="background:#13161f; padding:12px; border-radius:10px; margin-bottom:15px;">
              <div style="font-size:12px; color:#717a8c;">Баланс бота в Telegram:</div>
              <div id="adminBotBalance" style="font-size:18px; font-weight:bold; color:#ffb703;">Загрузка...</div>
            </div>

            <div style="background:#13161f; padding:12px; border-radius:10px; margin-bottom:15px;">
              <div style="font-weight:600; margin-bottom:8px; font-size:13px;">Выдать ⭐ игроку</div>
              <input type="number" id="adminTargetId" placeholder="Telegram ID игрока" style="width:100%; padding:8px; background:#1e222d; border:1px solid #2a2f3d; color:#fff; border-radius:8px; margin-bottom:8px; box-sizing:border-box;">
              <input type="number" id="adminStarsAmount" placeholder="Количество звезд (+/-)" style="width:100%; padding:8px; background:#1e222d; border:1px solid #2a2f3d; color:#fff; border-radius:8px; margin-bottom:8px; box-sizing:border-box;">
              <button class="btn-topup" style="width:100%; background:#4361ee;" onclick="adminGiveStars()">Выдать / Изменить</button>
            </div>

            <div style="font-weight:600; margin-bottom:8px; font-size:13px;">Игроки в базе данных:</div>
            <div id="adminUsersList" style="max-height: 150px; overflow-y: auto; background:#13161f; padding:8px; border-radius:8px; font-size:12px; color:#bbb;">
              Загрузка списка...
            </div>
          </div>
        `;
        document.body.appendChild(adminModal);
      }
      
      adminModal.style.display = 'flex';
      loadAdminData();
    }

    async function loadAdminData() {
      try {
        // Запрос баланса бота
        const resBal = await fetch(`${SERVER_URL}/api/bot_balance?user_id=${tgUserId}`, {
          headers: { 'ngrok-skip-browser-warning': 'true' }
        });
        const dataBal = await resBal.json();
        if (dataBal.status === 'ok') {
          document.getElementById('adminBotBalance').textContent = `${dataBal.balance.toLocaleString()} ⭐`;
        } else {
          document.getElementById('adminBotBalance').textContent = "Ошибка доступа";
        }

        // Запрос списка пользователей
        const resUsers = await fetch(`${SERVER_URL}/api/admin/users?user_id=${tgUserId}`, {
          headers: { 'ngrok-skip-browser-warning': 'true' }
        });
        const dataUsers = await resUsers.json();
        if (dataUsers.status === 'ok') {
          const listDiv = document.getElementById('adminUsersList');
          if (dataUsers.users.length === 0) {
            listDiv.innerHTML = "Нет данных о пользователях";
          } else {
            listDiv.innerHTML = dataUsers.users.map(u => `
              <div style="display:flex; justify-content:space-between; padding:4px 0; border-bottom:1px solid #1e222d;">
                <span>ID: ${u.user_id} (${u.first_name || 'Без имени'})</span>
                <span style="color:#ffb703;">${u.balance} ⭐</span>
              </div>
            `).join('');
          }
        }
      } catch (e) {
        console.error(e);
      }
    }

    async function adminGiveStars() {
      const targetId = document.getElementById('adminTargetId').value;
      const amount = document.getElementById('adminStarsAmount').value;

      if (!targetId || !amount) {
        alert("Заполни оба поля!");
        return;
      }

      try {
        const res = await fetch(`${SERVER_URL}/api/admin/give_stars`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'ngrok-skip-browser-warning': 'true' },
          body: JSON.stringify({
            admin_id: tgUserId,
            target_id: parseInt(targetId),
            amount: parseInt(amount)
          })
        });
        const data = await res.json();
        if (data.status === 'ok') {
          alert("✅ Успешно изменено!");
          document.getElementById('adminTargetId').value = '';
          document.getElementById('adminStarsAmount').value = '';
          loadAdminData();
        } else {
          alert("Ошибка: " + (data.message || 'Не удалось выдать'));
        }
      } catch (e) {
        alert("Ошибка соединения с сервером");
      }
    }
    // ------------------------------------

    async function fetchBalance() {
      try {
        const res = await fetch(`${SERVER_URL}/api/get_balance?user_id=${tgUserId}`, {
          headers: { 'ngrok-skip-browser-warning': 'true' }
        });
        const data = await res.json();
        if (data.status === 'ok') {
          balance = data.balance;
          updateBalanceDisplay();
        }
      } catch (e) {}
    }

    function updateBalanceDisplay() {
      document.getElementById('balanceDisplay').textContent = `${balance.toLocaleString()} ⭐`;
    }

    function openTopUpModal() { document.getElementById('topupModal').style.display = 'flex'; }
    function closeModal(id) { document.getElementById(id).style.display = 'none'; }
    function closeOverlay(id) { if (!isSpinning) document.getElementById(id).style.display = 'none'; }

    async function payStars(amount) {
      closeModal('topupModal');
      try {
        const response = await fetch(`${SERVER_URL}/api/create_invoice`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'ngrok-skip-browser-warning': 'true' },
          body: JSON.stringify({ amount: amount, user_id: tgUserId })
        });
        const data = await response.json();
        if (data.status === 'ok' && data.invoice_link) {
          tg.openInvoice(data.invoice_link, function(status) {
            if (status === 'paid') setTimeout(fetchBalance, 1000);
          });
        }
      } catch (e) { alert("Ошибка подключения!"); }
    }

    function payCustomStars() {
      const customAmount = parseInt(document.getElementById('customTopupInput').value);
      if (!customAmount || customAmount <= 0) {
        alert("Введите корректное число Звёзд!");
        return;
      }
      payStars(customAmount);
    }

    renderCases();
    fetchBalance();
    setInterval(renderCases, 30000);
  </script>
</body>
</html>
