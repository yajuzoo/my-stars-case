<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Кейсы за Stars</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      background-color: #1a1a24;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      text-align: center;
      margin: 0;
      padding: 20px;
    }
    h2 { 
      color: #f39c12; 
      margin-top: 10px;
    }
    
    .roulette-container {
      position: relative;
      width: 100%;
      max-width: 350px;
      height: 100px;
      margin: 25px auto;
      overflow: hidden;
      border: 3px solid #f39c12;
      border-radius: 12px;
      background: #0f0f17;
      box-shadow: 0 0 20px rgba(243, 156, 18, 0.2);
    }
    .pointer {
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 4px;
      height: 100%;
      background: #e74c3c;
      z-index: 10;
      box-shadow: 0 0 10px #e74c3c;
    }
    .tape {
      display: flex;
      position: absolute;
      left: 0;
      top: 10px;
      transition: transform 4s cubic-bezier(0.1, 1, 0.1, 1);
    }
    .item {
      min-width: 80px;
      height: 80px;
      margin: 0 5px;
      background: #2c2c3e;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: bold;
      color: #ffffff;
      border: 1px solid #3d3d5c;
    }
    
    .btn {
      background: linear-gradient(135deg, #f39c12, #d35400);
      color: #fff;
      border: none;
      padding: 16px 32px;
      font-size: 18px;
      font-weight: bold;
      border-radius: 12px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(243, 156, 18, 0.4);
      transition: transform 0.1s ease;
    }
    .btn:active {
      transform: scale(0.96);
    }
  </style>
</head>
<body>

  <h2>⭐ Открытие кейса ⭐</h2>
  <p style="color: #ccc;">Цена: <b style="color: #fff;">10 Stars</b></p>

  <div class="roulette-container">
    <div class="pointer"></div>
    <div class="tape" id="tape"></div>
  </div>

  <button class="btn" id="openBtn" onclick="buyCase()">Крутить за 10 ⭐</button>

  <script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    const prizes = ["10 Stars", "50 Stars", "100 Stars", "Джекпот!", "Пусто", "20 Stars"];
    const tape = document.getElementById('tape');

    function initTape() {
      tape.innerHTML = '';
      for (let i = 0; i < 50; i++) {
        const randomPrize = prizes[Math.floor(Math.random() * prizes.length)];
        const div = document.createElement('div');
        div.className = 'item';
        div.innerText = randomPrize;
        tape.appendChild(div);
      }
    }
    initTape();

    function buyCase() {
      // Передаем команду боту
      tg.sendData(JSON.stringify({ action: "buy_case" }));
      // Закрываем окно WebApp, чтобы открылся чат со счетом
      tg.close();
    }
  </script>
</body>
</html>
