<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Кейсы за Stars</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      background-color: #1a1a24;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      text-align: center;
      margin: 0;
      padding: 15px;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #252538;
      padding: 12px 20px;
      border-radius: 12px;
      margin-bottom: 20px;
      border: 1px solid #3d3d5c;
    }
    .balance-box {
      font-size: 16px;
      font-weight: bold;
      color: #f1c40f;
    }

    h2 { color: #f39c12; margin-top: 5px; }
    
    .roulette-container {
      position: relative;
      width: 100%;
      max-width: 350px;
      height: 100px;
      margin: 25px auto;
      overflow: hidden;
      border: 3px solid #f39c12;
      border-radius: 12px;
      background: #0f0f17;
      box-shadow: 0 0 20px rgba(243, 156, 18, 0.2);
    }
    .pointer {
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 4px;
      height: 100%;
      background: #e74c3c;
      z-index: 10;
      box-shadow: 0 0 10px #e74c3c;
    }
    .tape {
      display: flex;
      position: absolute;
      left: 0;
      top: 10px;
      transition: transform 4s cubic-bezier(0.1, 1, 0.1, 1);
    }
    .item {
      min-width: 80px;
      height: 80px;
      margin: 0 5px;
      background: #2c2c3e;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: bold;
      color: #ffffff;
      border: 1px solid #3d3d5c;
    }

    .btn {
      background: linear-gradient(135deg, #f39c12, #d35400);
      color: #fff;
      border: none;
      padding: 16px 32px;
      font-size: 18px;
      font-weight: bold;
      border-radius: 12px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(243, 156, 18, 0.4);
      width: 100%;
      max-width: 350px;
    }
    .btn:disabled {
      background: #555;
      cursor: not-allowed;
      box-shadow: none;
    }

    .result-msg {
      margin-top: 15px;
      font-size: 16px;
      font-weight: bold;
      min-height: 24px;
    }
  </style>
</head>
<body>

  <div class="header">
    <span>Мой баланс:</span>
    <div class="balance-box" id="balanceDisplay">0 ⭐</div>
  </div>

  <h2>⭐ Открытие кейса ⭐</h2>
  <p style="color: #ccc;">Цена: <b style="color: #fff;">10 Stars</b></p>

  <div class="roulette-container">
    <div class="pointer"></div>
    <div class="tape" id="tape"></div>
  </div>

  <button class="btn" id="openBtn" onclick="buyCase()">Крутить за 10 ⭐</button>
  <div class="result-msg" id="resultMsg"></div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    // Получаем Telegram User ID из приложения
    const tgUserId = tg.initDataUnsafe?.user?.id || new URLSearchParams(window.location.search).get('user_id') || "guest";

    const urlParams = new URLSearchParams(window.location.search);
    const invoiceUrl = urlParams.get('invoice');
    const winPrize = urlParams.get('prize') || "Пусто 💨";
    const winStars = parseInt(urlParams.get('stars') || "0");
    const paramBalance = parseInt(urlParams.get('balance') || "0");

    // Загружаем сохраненный баланс пользователя из локальной памяти устройства
    const storageKey = `stars_balance_${tgUserId}`;
    let currentBalance = localStorage.getItem(storageKey) !== null 
      ? parseInt(localStorage.getItem(storageKey)) 
      : paramBalance;

    // Если параметр с сервера больше (например, были зачисления), обновляем
    if (paramBalance > currentBalance) {
      currentBalance = paramBalance;
      localStorage.setItem(storageKey, currentBalance);
    }

    const tape = document.getElementById('tape');
    const openBtn = document.getElementById('openBtn');
    const balanceDisplay = document.getElementById('balanceDisplay');
    const resultMsg = document.getElementById('resultMsg');

    balanceDisplay.innerText = currentBalance + " ⭐";

    const possiblePrizes = ["Пусто 💨", "5 Stars ⭐", "10 Stars ⭐", "20 Stars ⭐", "100 Stars 💎"];
    
    function initTape() {
      tape.style.transition = "none";
      tape.style.transform = "translateX(0px)";
      tape.innerHTML = '';
      
      for (let i = 0; i < 40; i++) {
        const item = document.createElement('div');
        item.className = 'item';
        if (i === 34) {
          item.innerText = winPrize;
          item.style.border = "2px solid #f39c12";
          item.style.background = "#3a2e1e";
        } else {
          item.innerText = possiblePrizes[Math.floor(Math.random() * possiblePrizes.length)];
        }
        tape.appendChild(item);
      }
    }
    initTape();

    function buyCase() {
      if (!invoiceUrl) {
        alert("Перезапустите бота через /start");
        return;
      }

      tg.openInvoice(invoiceUrl, function(status) {
        if (status === 'paid') {
          openBtn.disabled = true;
          resultMsg.innerText = "🌀 Рулетка крутится...";
          
          setTimeout(() => {
            tape.style.transition = "transform 4s cubic-bezier(0.1, 1, 0.1, 1)";
            tape.style.transform = "translateX(-2970px)";
          }, 50);

          setTimeout(() => {
            // Обновляем баланс и сохраняем его локально под ID аккаунта
            currentBalance += winStars;
            localStorage.setItem(storageKey, currentBalance);
            balanceDisplay.innerText = currentBalance + " ⭐";
            
            resultMsg.innerHTML = "🎉 Выпало: <b style='color:#f1c40f'>" + winPrize + "</b>";
            
            openBtn.innerText = "Крутить еще!";
            openBtn.disabled = false;
          }, 4200);
        } else {
          resultMsg.innerText = "❌ Оплата отменена";
        }
      });
    }
  </script>
</body>
</html>
