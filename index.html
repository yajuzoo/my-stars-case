<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>NFT Cases Stars</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #0b0c10;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      padding-bottom: 40px;
    }
    .navbar {
      background: #12141d; border-bottom: 1px solid #1f2330; padding: 12px 16px;
      display: flex; justify-content: space-between; align-items: center;
      position: sticky; top: 0; z-index: 100;
    }
    .user-profile { display: flex; align-items: center; gap: 10px; cursor: pointer; }
    .avatar {
      width: 38px; height: 38px; border-radius: 50%; background: #202433;
      display: flex; align-items: center; justify-content: center; font-size: 18px; border: 1px solid #0088cc;
    }
    .username { font-size: 13px; font-weight: 600; }
    .profile-btn-label { font-size: 10px; color: #0088cc; text-transform: uppercase; font-weight: 700; }
    .balance-box {
      background: #181b26; border: 1px solid #282d3f; border-radius: 10px;
      padding: 6px 12px; display: flex; align-items: center; gap: 8px;
    }
    .balance-val { font-size: 16px; font-weight: 800; color: #ffb703; }
    .btn-add {
      background: #0088cc; color: white; border: none; width: 24px; height: 24px;
      border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer;
    }
    .container { padding: 16px; max-width: 600px; margin: 0 auto; }
    .section-title { font-size: 14px; color: #717a8c; text-transform: uppercase; margin-bottom: 12px; font-weight: 700; }
    .cases-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
    .case-card {
      background: #141722; border: 1px solid #202536; border-radius: 14px;
      padding: 14px; text-align: center; cursor: pointer; position: relative;
    }
    .case-icon { font-size: 44px; margin-bottom: 6px; }
    .case-title { font-size: 14px; font-weight: 700; margin-bottom: 4px; }
    .case-price { font-size: 13px; color: #ffb703; font-weight: 700; }
    .cooldown-badge {
      position: absolute; top: 6px; right: 6px; background: #e63946;
      color: #fff; font-size: 10px; font-weight: 700; padding: 2px 6px; border-radius: 6px;
    }
    .overlay {
      display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: #0b0c10; z-index: 200; flex-direction: column; overflow-y: auto;
    }
    .overlay-header {
      padding: 16px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #1c202e;
    }
    .btn-back {
      background: #191d2b; color: #fff; border: 1px solid #2a3147;
      border-radius: 8px; padding: 6px 14px; font-weight: 600; cursor: pointer;
    }
    .roulette-wrapper {
      position: relative; width: 100%; height: 120px; background: #121520;
      border-top: 2px solid #282e44; border-bottom: 2px solid #282e44; margin: 30px 0; overflow: hidden;
    }
    .pointer {
      position: absolute; top: 0; bottom: 0; left: 50%; width: 4px;
      background: #ffb703; z-index: 10; transform: translateX(-50%); box-shadow: 0 0 10px #ffb703;
    }
    .roulette-track {
      display: flex; position: absolute; top: 10px; left: 0; height: 100px;
      transition: transform 4.5s cubic-bezier(0.15, 0.9, 0.2, 1);
    }
    .roulette-item {
      min-width: 100px; width: 100px; height: 100px; margin: 0; background: #181c2b;
      border-right: 1px solid #2a3147; border-top: 1px solid #2a3147; border-bottom: 1px solid #2a3147;
      display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 12px; font-weight: bold;
    }
    .roulette-item .icon { font-size: 32px; margin-bottom: 4px; }
    .drop-items-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 16px; }
    .item-card { background: #141724; border: 1px solid #22283b; border-radius: 10px; padding: 10px; text-align: center; }
    .item-card .icon { font-size: 30px; }
    .item-card .name { font-size: 11px; margin-top: 4px; color: #a0a7b8; }
    .item-card .value { font-size: 11px; color: #ffb703; font-weight: 700; margin-top: 2px; }
    .inventory-list { display: flex; flex-direction: column; gap: 10px; margin-top: 10px; }
    .inv-item {
      background: #141724; border: 1px solid #22283b; border-radius: 12px;
      padding: 12px; display: flex; align-items: center; justify-content: space-between;
    }
    .btn-sell {
      background: #282e42; color: #ffb703; border: 1px solid #3d4663;
      border-radius: 6px; padding: 6px 12px; font-size: 12px; font-weight: 700; cursor: pointer;
    }
    .withdraw-box { background: #141724; border: 1px solid #22283b; border-radius: 14px; padding: 16px; margin-bottom: 20px; }
    .withdraw-input {
      width: 100%; padding: 12px; background: #1a1e2d; border: 1px solid #2e364f;
      border-radius: 8px; color: #fff; font-size: 16px; margin: 10px 0; outline: none;
    }
    .withdraw-input::-webkit-outer-spin-button, .withdraw-input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
    .withdraw-input[type=number] { -moz-appearance: textfield; }
    .withdraw-input:focus { border-color: #0088cc; }
    .btn-withdraw-main {
      width: 100%; background: #0088cc; color: white; border: none;
      padding: 12px; border-radius: 8px; font-weight: 700; font-size: 15px; cursor: pointer;
    }
    .modal {
      display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.85); align-items: center; justify-content: center; z-index: 300;
    }
    .modal-box { background: #141722; border: 1px solid #252b3e; border-radius: 18px; padding: 20px; width: 90%; max-width: 380px; text-align: center; }
    .topup-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin: 14px 0; }
    .star-btn { background: #1d2233; border: 1px solid #2e364f; border-radius: 8px; padding: 10px; font-weight: 700; color: #ffb703; cursor: pointer; }
    .custom-topup-input {
      width: 100%; padding: 10px; background: #141722; border: 1px solid #2e364f; border-radius: 8px;
      color: #fff; font-size: 14px; margin-bottom: 10px; outline: none; text-align: center;
    }
  </style>
</head>
<body>

  <div class="navbar">
    <div class="user-profile" onclick="openProfile()">
      <div class="avatar">👤</div>
      <div class="user-info">
        <span class="username" id="profileName">Пользователь</span>
        <span class="profile-btn-label">Профиль & Вывод 📦</span>
      </div>
    </div>
    <div class="balance-box">
      <span class="balance-val" id="balanceDisplay">... ⭐</span>
      <button class="btn-add" onclick="openTopUpModal()">+</button>
    </div>
  </div>

  <div class="container">
    <div class="section-title">NFT Кейсы</div>
    <div class="cases-grid" id="casesGrid">Загрузка...</div>
  </div>

  <!-- Оверлей кейса -->
  <div class="overlay" id="caseOverlay">
    <div class="overlay-header">
      <button class="btn-back" onclick="closeOverlay('caseOverlay')">← Назад</button>
      <h3 id="overlayCaseTitle">Кейс</h3>
      <div style="width:50px;"></div>
    </div>
    <div class="container" style="text-align:center;">
      <div class="roulette-wrapper">
        <div class="pointer"></div>
        <div class="roulette-track" id="rouletteTrack"></div>
      </div>
      <button class="btn-add" id="btnSpin" style="width:100%; height:44px; border-radius:10px; font-size:16px;" onclick="spinRoulette()">Крутить кейс</button>

      <div style="margin-top:30px; text-align:left;">
        <div class="section-title">Содержимое кейса</div>
        <div class="drop-items-grid" id="dropItemsGrid"></div>
      </div>
    </div>
  </div>

  <!-- Профиль / Инвентарь -->
  <div class="overlay" id="profileOverlay">
    <div class="overlay-header">
      <button class="btn-back" onclick="closeOverlay('profileOverlay')">← Назад</button>
      <h3>Личный Кабинет</h3>
      <div style="width:50px;"></div>
    </div>
    <div class="container">
      <div style="background:#141724; border:1px solid #22283b; border-radius:14px; padding:16px; margin-bottom:16px; text-align:center;">
        <h2 id="invBalance" style="color:#ffb703; margin-bottom:4px;">0 ⭐</h2>
        <p style="font-size:12px; color:#717a8c;">Текущий баланс</p>
      </div>

      <div class="withdraw-box">
        <div style="font-size:14px; font-weight:700;">Вывести ⭐ на аккаунт</div>
        <p style="font-size:11px; color:#717a8c; margin-top:2px;">Минимальный вывод: 250 ⭐</p>
        <input type="number" id="withdrawAmount" class="withdraw-input" placeholder="Введите сумму (от 250)" min="250">
        <button class="btn-withdraw-main" onclick="requestWithdraw()">Запросить вывод</button>
      </div>

      <div class="section-title">Выбитые предметы</div>
      <div class="inventory-list" id="inventoryList"></div>
    </div>
  </div>

  <!-- Модалка пополнения -->
  <div class="modal" id="topupModal">
    <div class="modal-box">
      <h3>Пополнение баланса ⭐</h3>
      <div class="topup-grid">
        <div class="star-btn" onclick="payStars(50)">50 ⭐</div>
        <div class="star-btn" onclick="payStars(100)">100 ⭐</div>
        <div class="star-btn" onclick="payStars(500)">500 ⭐</div>
        <div class="star-btn" onclick="payStars(1000)">1 000 ⭐</div>
        <div class="star-btn" onclick="payStars(2500)">2 500 ⭐</div>
        <div class="star-btn" onclick="payStars(5000)">5 000 ⭐</div>
        <div class="star-btn" onclick="payStars(10000)">10 000 ⭐</div>
        <div class="star-btn" onclick="payStars(20000)">20 000 ⭐</div>
      </div>
      <div style="margin-top: 10px;">
        <input type="number" id="customTopupInput" class="custom-topup-input" placeholder="Свое количество ⭐" min="1">
        <button class="star-btn" style="width:100%; background:#0088cc; color:#fff;" onclick="payCustomStars()">Пополнить на свое число</button>
      </div>
      <button class="btn-back" style="width:100%; margin-top:10px;" onclick="closeModal('topupModal')">Отмена</button>
    </div>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.expand();
    const SERVER_URL = "https://006b-2a03-32c0-7000-cc88-d588-9b53-e53-54a2.ngrok-free.app";
    const tgUserId = tg.initDataUnsafe?.user?.id || 8712421526;
    
    document.getElementById('profileName').textContent = tg.initDataUnsafe?.user?.first_name || "Игрок";

    let balance = 0;
    let inventory = [];
    let casesData = [];
    let lastFreeOpen = 0;
    let currentCase = null;
    let isSpinning = false;
    let isAdmin = false;

    // Инициализация приложения: запрашиваем данные у сервера
    async function initApp() {
      try {
        const res = await fetch(`${SERVER_URL}/api/init?user_id=${tgUserId}&t=${Date.now()}`, { 
  headers: { 
    'ngrok-skip-browser-warning': 'true',
    'Cache-Control': 'no-cache'
  } 
});
        const data = await res.json();
        if (data.status === 'ok') {
          balance = data.balance;
          inventory = data.inventory;
          casesData = data.cases;
          lastFreeOpen = data.last_free_open;
          isAdmin = data.is_admin;
          
          updateBalanceDisplay();
          renderCases();
          checkAdminBtn();
        }
      } catch (e) {
        console.error("Ошибка загрузки данных", e);
      }
    }

    function checkAdminBtn() {
      if (isAdmin && !document.getElementById('adminPanelBtn')) {
        const balanceBlock = document.getElementById('balanceDisplay').parentNode;
        const adminBtn = document.createElement('button');
        adminBtn.id = 'adminPanelBtn';
        adminBtn.className = 'btn-add';
        adminBtn.style.background = '#e63946';
        adminBtn.style.marginRight = '8px';
        adminBtn.style.width = 'auto';
        adminBtn.style.padding = '0 10px';
        adminBtn.innerHTML = '🛠';
        adminBtn.onclick = openAdminPanel;
        balanceBlock.parentNode.insertBefore(adminBtn, balanceBlock);
      }
    }

    function getFreeCooldownStr() {
      const passed = Date.now() - lastFreeOpen;
      const remaining = (3600 * 1000) - passed;
      return remaining > 0 ? Math.ceil(remaining / (60 * 1000)) : 0;
    }

    function renderCases() {
      const freeCd = getFreeCooldownStr();
      const grid = document.getElementById('casesGrid');
      grid.innerHTML = casesData.map(c => `
        <div class="case-card" onclick="openCaseDetails(${c.id})">
          ${c.id === 1 && freeCd > 0 ? `<div class="cooldown-badge">⏳ ${freeCd} мин</div>` : ''}
          <div class="case-icon">${c.icon}</div>
          <div class="case-title">${c.name}</div>
          <div class="case-price">${c.price > 0 ? c.price.toLocaleString() + ' ⭐' : 'БЕСПЛАТНО'}</div>
        </div>
      `).join('');
    }

    function openCaseDetails(id) {
      currentCase = casesData.find(x => x.id === id);
      if (currentCase.id === 1 && getFreeCooldownStr() > 0) {
        alert(`⏱ Бесплатный кейс будет доступен через ${getFreeCooldownStr()} мин.`);
        return;
      }

      document.getElementById('overlayCaseTitle').textContent = currentCase.name;
      document.getElementById('dropItemsGrid').innerHTML = currentCase.items.map(it => `
        <div class="item-card">
          <div class="icon">${it.icon}</div>
          <div class="name">${it.name}</div>
          <div class="value">${it.value.toLocaleString()} ⭐</div>
        </div>
      `).join('');

      buildVisualTrack();
      document.getElementById('caseOverlay').style.display = 'flex';
    }

    function buildVisualTrack() {
  const track = document.getElementById('rouletteTrack');
  
  // Отключаем анимацию и возвращаем ленту в начало
  track.style.transition = 'none';
  track.style.transform = 'translateX(0px)';
  
  // Обязательный костыль для браузера, чтобы он сразу применил сброс позиции
  void track.offsetWidth; 

  // Генерируем элементы
  let html = '';
  for (let i = 0; i < 60; i++) {
    const item = currentCase.items[Math.floor(Math.random() * currentCase.items.length)];
    html += `<div class="roulette-item"><div class="icon">${item.icon}</div><div>${item.name}</div></div>`;
  }
  track.innerHTML = html;
}

    async function spinRoulette() {
      if (isSpinning) return;
      if (currentCase.id === 1 && getFreeCooldownStr() > 0) {
        alert("⏱ Задержка бесплатного кейса!");
        return;
      }
      if (currentCase.price > 0 && balance < currentCase.price) {
        alert("Недостаточно Звёзд!");
        openTopUpModal();
        return;
      }

      isSpinning = true;
      
      // Отправляем запрос на сервер для честного рандома
      try {
        const res = await fetch(`${SERVER_URL}/api/open_case`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'ngrok-skip-browser-warning': 'true' },
          body: JSON.stringify({ user_id: tgUserId, case_id: currentCase.id })
        });
        const data = await res.json();
        
        if (data.status !== 'ok') {
          alert(data.message);
          isSpinning = false;
          return;
        }

        // Обновляем баланс сразу же, чтобы юзер видел списание
        balance = data.balance;
        if(currentCase.id === 1) lastFreeOpen = Date.now();
        updateBalanceDisplay();

        const winItem = data.item;
        const track = document.getElementById('rouletteTrack');
        
        // Вставляем победный предмет на 45 позицию
        const children = track.children;
        children[45].querySelector('.icon').textContent = winItem.icon;
        children[45].children[1].textContent = winItem.name;

        const itemWidth = 100; 
        const wrapperWidth = document.querySelector('.roulette-wrapper').clientWidth;
        const targetOffset = -(45 * itemWidth - (wrapperWidth / 2) + (itemWidth / 2));

        // Жестко сбрасываем позицию перед стартом, чтобы избежать багов со статичностью при повторных прокрутах
        track.style.transition = 'none';
        track.style.transform = 'translateX(0px)';
        void track.offsetWidth; // Принудительный reflow браузера

        setTimeout(() => {
          track.style.transition = 'transform 4.5s cubic-bezier(0.15, 0.9, 0.2, 1)';
          track.style.transform = `translateX(${targetOffset}px)`;
        }, 50);

        setTimeout(() => {
          isSpinning = false;
          inventory.push(winItem); // Добавляем в инвентарь на клиенте
          renderCases();
          alert(`🎉 Выбито: ${winItem.name}!`);
        }, 4850);

      } catch (e) {
        alert("Ошибка связи с сервером");
        isSpinning = false;
      }
    }

    function openProfile() {
      document.getElementById('invBalance').textContent = `${balance.toLocaleString()} ⭐`;
      renderInventory();
      document.getElementById('profileOverlay').style.display = 'flex';
    }

    function renderInventory() {
      const list = document.getElementById('inventoryList');
      if (inventory.length === 0) {
        list.innerHTML = `<p style="text-align:center; color:#717a8c; padding:10px;">Инвентарь пуст.</p>`;
        return;
      }
      list.innerHTML = inventory.map(item => `
        <div class="inv-item">
          <div style="display:flex; align-items:center; gap:10px;">
            <div style="font-size:26px;">${item.icon}</div>
            <div>
              <div style="font-weight:700; font-size:13px;">${item.name}</div>
              <div style="font-size:11px; color:#ffb703;">${item.value.toLocaleString()} ⭐</div>
            </div>
          </div>
          <button class="btn-sell" onclick="sellItem(${item.id})">Продать</button>
        </div>
      `).join('');
    }

    async function sellItem(itemId) {
      try {
        const res = await fetch(`${SERVER_URL}/api/sell_item`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'ngrok-skip-browser-warning': 'true' },
          body: JSON.stringify({ user_id: tgUserId, item_id: itemId })
        });
        const data = await res.json();
        
        if (data.status === 'ok') {
          balance = data.balance;
          inventory = inventory.filter(x => x.id !== itemId);
          updateBalanceDisplay();
          document.getElementById('invBalance').textContent = `${balance.toLocaleString()} ⭐`;
          renderInventory();
        } else {
          alert(data.message);
        }
      } catch (e) {
        alert("Ошибка продажи");
      }
    }

    async function requestWithdraw() {
      const amount = parseInt(document.getElementById('withdrawAmount').value);
      if (!amount || amount < 250) return alert("Минимальная сумма — 250 ⭐!");
      if (amount > balance) return alert("У вас недостаточно звёзд!");
      
      try {
        const response = await fetch(`${SERVER_URL}/api/withdraw`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'ngrok-skip-browser-warning': 'true' },
          body: JSON.stringify({
            user_id: tgUserId, username: tg.initDataUnsafe?.user?.username || '',
            first_name: tg.initDataUnsafe?.user?.first_name || 'Игрок', amount: amount
          })
        });
        const data = await response.json();
        if (data.status === 'ok') {
          balance -= amount;
          updateBalanceDisplay();
          document.getElementById('invBalance').textContent = `${balance.toLocaleString()} ⭐`;
          document.getElementById('withdrawAmount').value = '';
          alert(`✅ Заявка на вывод принята!`);
        } else alert(data.message);
      } catch (e) { alert("Ошибка сервера!"); }
    }

    // --- БЕЗОПАСНАЯ АДМИН-ПАНЕЛЬ ---
    async function openAdminPanel() {
      let adminModal = document.getElementById('adminModal');
      if (!adminModal) {
        adminModal = document.createElement('div');
        adminModal.id = 'adminModal';
        adminModal.className = 'overlay';
        adminModal.innerHTML = `
          <div class="container" style="max-width: 450px;">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 12px;">
              <h3 style="margin:0;">🛠 Админ-панель</h3>
              <button onclick="closeModal('adminModal')" style="background:none; border:none; color:#fff; font-size:18px; cursor:pointer;">✕</button>
            </div>
            
            <div style="background:#13161f; padding:10px; border-radius:10px; margin-bottom:10px;">
              <div style="font-weight:600; margin-bottom:6px; font-size:12px;">Выдать ⭐ игроку</div>
              <input type="number" id="adminTargetId" placeholder="ID игрока" style="width:100%; padding:6px; background:#1e222d; border:1px solid #2a2f3d; color:#fff; border-radius:6px; margin-bottom:6px;">
              <input type="number" id="adminStarsAmount" placeholder="Количество звезд (+/-)" style="width:100%; padding:6px; background:#1e222d; border:1px solid #2a2f3d; color:#fff; border-radius:6px; margin-bottom:6px;">
              <button class="btn-add" style="width:100%; height:auto; padding:8px; border-radius:6px;" onclick="adminAction('give_stars')">Изменить баланс</button>
            </div>

            <div style="background:#13161f; padding:10px; border-radius:10px; margin-bottom:10px;">
              <div style="font-weight:600; margin-bottom:6px; font-size:12px;">Установить шанс окупа</div>
              <input type="number" id="adminRtpId" placeholder="ID игрока" style="width:100%; padding:6px; background:#1e222d; border:1px solid #2a2f3d; color:#fff; border-radius:6px; margin-bottom:6px;">
              <input type="number" id="adminRtpVal" placeholder="Шанс окупа в % (например: 70)" style="width:100%; padding:6px; background:#1e222d; border:1px solid #2a2f3d; color:#fff; border-radius:6px; margin-bottom:6px;">
              <button class="btn-add" style="width:100%; height:auto; padding:8px; border-radius:6px; background:#7209b7;" onclick="adminAction('set_rtp')">Сохранить шанс</button>
            </div>
            
            <div style="background:#13161f; padding:10px; border-radius:10px; margin-bottom:10px;">
              <div style="font-weight:600; margin-bottom:6px; font-size:12px;">Админы</div>
              <input type="number" id="newAdminId" placeholder="ID друга" style="width:100%; padding:6px; background:#1e222d; border:1px solid #2a2f3d; color:#fff; border-radius:6px; margin-bottom:6px;">
              <button class="btn-add" style="width:100%; height:auto; padding:8px; border-radius:6px; background:#f77f00; margin-bottom: 8px;" onclick="adminAction('add_admin')">Добавить</button>
              <div id="adminListContainer" style="font-size:11px;"></div>
            </div>

            <div style="font-weight:600; margin-bottom:4px; font-size:12px;">Игроки:</div>
            <div id="adminUsersList" style="max-height: 100px; overflow-y: auto; background:#13161f; padding:8px; border-radius:8px; font-size:11px;"></div>
          </div>
        `;
        document.body.appendChild(adminModal);
      }
      
      adminModal.style.display = 'flex';
      loadAdminData();
    }

    async function loadAdminData() {
      try {
        const res = await fetch(`${SERVER_URL}/api/admin/data?user_id=${tgUserId}`, { headers: { 'ngrok-skip-browser-warning': 'true' }});
        const data = await res.json();
        if (data.status === 'ok') {
          document.getElementById('adminUsersList').innerHTML = data.users.map(u => `<div style="display:flex; justify-content:space-between; padding:3px 0; border-bottom:1px solid #1e222d;"><span>ID: ${u.user_id} (${u.first_name})</span><span style="color:#ffb703;">${u.balance} ⭐</span></div>`).join('');
          document.getElementById('adminListContainer').innerHTML = data.admins.map(id => `<div style="display:flex; justify-content:space-between; padding:4px 0; border-bottom:1px solid #2a2f3d;"><span>ID: ${id}</span> <button onclick="adminAction('remove_admin', ${id})" style="background:#e63946; border:none; color:#fff; padding:2px 6px; border-radius:4px; font-size:10px;">Удалить</button></div>`).join('');
        }
      } catch (e) {}
    }

    async function adminAction(action, directTarget = null) {
      let targetId, amount, rtp;
      if (action === 'give_stars') { targetId = document.getElementById('adminTargetId').value; amount = document.getElementById('adminStarsAmount').value; }
      if (action === 'set_rtp') { targetId = document.getElementById('adminRtpId').value; rtp = document.getElementById('adminRtpVal').value; }
      if (action === 'add_admin') { targetId = document.getElementById('newAdminId').value; }
      if (action === 'remove_admin') { targetId = directTarget; }

      if (!targetId) return alert("Укажи ID!");
      
      await fetch(`${SERVER_URL}/api/admin/action`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'ngrok-skip-browser-warning': 'true' },
        body: JSON.stringify({ admin_id: tgUserId, action: action, target_id: targetId, amount: amount, rtp: rtp })
      });
      alert("✅ Выполнено!");
      loadAdminData();
    }

    function updateBalanceDisplay() { document.getElementById('balanceDisplay').textContent = `${balance.toLocaleString()} ⭐`; }
    function openTopUpModal() { document.getElementById('topupModal').style.display = 'flex'; }
    function closeModal(id) { document.getElementById(id).style.display = 'none'; }
    function closeOverlay(id) { if (!isSpinning) document.getElementById(id).style.display = 'none'; }

    async function payStars(amount) {
      closeModal('topupModal');
      try {
        const response = await fetch(`${SERVER_URL}/api/create_invoice`, {
          method: 'POST', headers: { 'Content-Type': 'application/json', 'ngrok-skip-browser-warning': 'true' },
          body: JSON.stringify({ amount: amount, user_id: tgUserId })
        });
        const data = await response.json();
        if (data.status === 'ok') tg.openInvoice(data.invoice_link, function(status) { if (status === 'paid') setTimeout(initApp, 1000); });
      } catch (e) { alert("Ошибка!"); }
    }
    function payCustomStars() { const val = parseInt(document.getElementById('customTopupInput').value); if(val>0) payStars(val); }

    // Старт
    initApp();
    setInterval(renderCases, 60000); // Обновление счетчика бесплатного кейса
  </script>
</body>
</html>
