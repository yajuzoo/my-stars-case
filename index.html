<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NFT Cases Stars</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0f1015;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    
    /* Шапка баланса */
    .header {
      background: #181920;
      border: 1px solid #282932;
      border-radius: 16px;
      padding: 16px 24px;
      width: 100%;
      max-width: 500px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }
    .balance-info { display: flex; flex-direction: column; }
    .balance-label { font-size: 12px; color: #8e8e93; text-transform: uppercase; }
    .balance-val { font-size: 24px; font-weight: bold; color: #ffb703; }
    .btn-topup {
      background: #0088cc;
      color: white;
      border: none;
      border-radius: 10px;
      padding: 10px 18px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }

    /* Сеть Кейсов */
    .cases-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      width: 100%;
      max-width: 500px;
      margin-bottom: 30px;
    }
    .case-card {
      background: #181920;
      border: 1px solid #282932;
      border-radius: 14px;
      padding: 14px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .case-icon { font-size: 40px; margin-bottom: 8px; }
    .case-title { font-size: 14px; font-weight: bold; margin-bottom: 4px; }
    .case-price { font-size: 13px; color: #ffb703; font-weight: 600; margin-bottom: 10px; }
    .btn-open {
      background: #2b2d3a;
      color: #fff;
      border: 1px solid #3f4255;
      border-radius: 8px;
      padding: 8px;
      width: 100%;
      font-weight: bold;
      cursor: pointer;
    }

    /* Модалки */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.85);
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }
    .modal-box {
      background: #181920;
      border: 1px solid #282932;
      border-radius: 20px;
      padding: 20px;
      width: 85%;
      max-width: 360px;
      text-align: center;
    }
    .star-btn {
      background: #252732;
      margin: 8px 0;
      padding: 12px;
      border-radius: 10px;
      font-weight: bold;
      cursor: pointer;
      border: 1px solid #333646;
    }
    .drop-result { font-size: 48px; margin: 15px 0; }
  </style>
</head>
<body>

  <div class="header">
    <div class="balance-info">
      <span class="balance-label">Твой Баланс</span>
      <span class="balance-val" id="balanceDisplay">0 ⭐</span>
    </div>
    <button class="btn-topup" onclick="openModal('topupModal')">Пополнить</button>
  </div>

  <div class="cases-grid" id="casesGrid"></div>

  <!-- Модалка пополнения -->
  <div class="modal" id="topupModal">
    <div class="modal-box">
      <h3>Пополнение ⭐</h3>
      <div style="margin: 15px 0;">
        <div class="star-btn" onclick="payStars(10)">10 ⭐</div>
        <div class="star-btn" onclick="payStars(50)">50 ⭐</div>
        <div class="star-btn" onclick="payStars(100)">100 ⭐</div>
        <div class="star-btn" onclick="payStars(500)">500 ⭐</div>
        <div class="star-btn" onclick="payStars(1000)">1000 ⭐</div>
      </div>
      <button class="btn-topup" style="background:#333; width:100%" onclick="closeModal('topupModal')">Закрыть</button>
    </div>
  </div>

  <!-- Модалка открытия кейса -->
  <div class="modal" id="winModal">
    <div class="modal-box">
      <h3 id="winTitle">Вам выпало!</h3>
      <div class="drop-result" id="winIcon">🎁</div>
      <p style="font-size: 20px; font-weight: bold; color:#ffb703;" id="winText">10 ⭐</p>
      <button class="btn-topup" style="width:100%; margin-top:20px;" onclick="closeModal('winModal')">Забрать</button>
    </div>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    // =====================================================================
    // ⚙️ ССЫЛКА НА ТВОЙ NGROK / LOCALTUNNEL (МЕНЯТЬ ЗДЕСЬ)
    // =====================================================================
    const SERVER_URL = "https://9f1e-2a03-32c0-7000-cc88-d588-9b53-e53-54a2.ngrok-free.app";
    // =====================================================================

    const tgUserId = tg.initDataUnsafe?.user?.id || 8712421526;
    let balance = 0;

    // 20 NFT Кейсов с жестким шансом
    const casesData = [
      { id: 1, name: "Free NFT", price: 0, icon: "📦", min: 1, max: 5 },
      { id: 2, name: "Новичок NFT", price: 5, icon: "👾", min: 1, max: 10 },
      { id: 3, name: "Квадробер NFT", price: 10, icon: "🐱", min: 1, max: 20 },
      { id: 4, name: "Аркановый", price: 15, icon: "🔮", min: 2, max: 30 },
      { id: 5, name: "Пепе Секрет", price: 25, icon: "🐸", min: 5, max: 50 },
      { id: 6, name: "Киберпанк", price: 40, icon: "🤖", min: 10, max: 80 },
      { id: 7, name: "Мажор NFT", price: 50, icon: "🎩", min: 10, max: 100 },
      { id: 8, name: "Алмазный", price: 75, icon: "💎", min: 15, max: 150 },
      { id: 9, name: "Золотая Жила", price: 100, icon: "🏆", min: 20, max: 200 },
      { id: 10, name: "Илон Маск", price: 150, icon: "🚀", min: 30, max: 300 },
      { id: 11, name: "Дуров Секрет", price: 200, icon: "✈️", min: 40, max: 400 },
      { id: 12, name: "Крипто Барон", price: 300, icon: "💰", min: 50, max: 600 },
      { id: 13, name: "NFT Обезьяна", price: 500, icon: "🐵", min: 100, max: 1000 },
      { id: 14, name: "Дракон NFT", price: 750, icon: "🐉", min: 150, max: 1500 },
      { id: 15, name: "Абсолют", price: 1000, icon: "⚡", min: 200, max: 2000 },
      { id: 16, name: "Космос NFT", price: 1500, icon: "🌌", min: 300, max: 3000 },
      { id: 17, name: "Властелин", price: 2000, icon: "👑", min: 400, max: 4000 },
      { id: 18, name: "Олимп NFT", price: 3000, icon: "🏛️", min: 500, max: 6000 },
      { id: 19, name: "Вселенная", price: 5000, icon: "🪐", min: 1000, max: 10000 },
      { id: 20, name: "Godlike NFT", price: 10000, icon: "🌌", min: 2000, max: 50000 }
    ];

    function renderCases() {
      const grid = document.getElementById('casesGrid');
      grid.innerHTML = casesData.map(c => `
        <div class="case-card">
          <div class="case-icon">${c.icon}</div>
          <div class="case-title">${c.name}</div>
          <div class="case-price">${c.price > 0 ? c.price + ' ⭐' : 'БЕСПЛАТНО'}</div>
          <button class="btn-open" onclick="openCase(${c.id})">Открыть</button>
        </div>
      `).join('');
    }

    async function fetchBalance() {
      try {
        const res = await fetch(`${SERVER_URL}/api/get_balance?user_id=${tgUserId}`, {
          headers: { 'ngrok-skip-browser-warning': 'true' }
        });
        const data = await res.json();
        if (data.status === 'ok') {
          balance = data.balance;
          document.getElementById('balanceDisplay').textContent = `${balance} ⭐`;
        }
      } catch (e) { console.error(e); }
    }

    async function payStars(amount) {
      closeModal('topupModal');
      try {
        const response = await fetch(`${SERVER_URL}/api/create_invoice`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'ngrok-skip-browser-warning': 'true' },
          body: JSON.stringify({ amount: amount, user_id: tgUserId })
        });
        const data = await response.json();
        if (data.status === 'ok' && data.invoice_link) {
          tg.openInvoice(data.invoice_link, function(status) {
            if (status === 'paid') setTimeout(fetchBalance, 1000);
          });
        }
      } catch (e) { alert("Ошибка подключения к серверу!"); }
    }

    function openCase(id) {
      const c = casesData.find(x => x.id === id);
      if (balance < c.price) {
        alert("Недостаточно Звёзд на балансе!");
        openModal('topupModal');
        return;
      }

      balance -= c.price;
      document.getElementById('balanceDisplay').textContent = `${balance} ⭐`;

      // Расчет шанса: 0.00001% на супер-джекпот, иначе минимальный дроп
      const isJackpot = Math.random() < 0.0000001; // 0.00001%
      let winAmount = isJackpot ? c.max : Math.floor(Math.random() * (c.min * 1.5 - c.min + 1)) + c.min;

      balance += winAmount;
      document.getElementById('balanceDisplay').textContent = `${balance} ⭐`;

      document.getElementById('winIcon').textContent = c.icon;
      document.getElementById('winText').textContent = `+${winAmount} ⭐`;
      openModal('winModal');
    }

    function openModal(id) { document.getElementById(id).style.display = 'flex'; }
    function closeModal(id) { document.getElementById(id).style.display = 'none'; }

    renderCases();
    fetchBalance();
  </script>
</body>
</html>
