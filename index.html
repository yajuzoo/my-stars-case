    function openCaseDetails(id) {
      currentCase = casesData.find(x => x.id === id);
      document.getElementById('overlayCaseTitle').textContent = currentCase.name;

      // Render items preview grid
      const grid = document.getElementById('dropItemsGrid');
      grid.innerHTML = currentCase.items.map(it => `

          <div class="icon">${it.icon}</div>
          <div class="name">${it.name}</div>
          <div class="value">${it.value} ⭐</div>
        </div>
      `).join('');

      buildRouletteTrack();
      document.getElementById('caseOverlay').style.display = 'flex';
    }

    function buildRouletteTrack() {
      const track = document.getElementById('rouletteTrack');
      track.style.transition = 'none';
      track.style.transform = 'translateX(0px)';
      
      let html = '';
      for (let i = 0; i < 60; i++) {
        const item = currentCase.items[Math.floor(Math.random() * currentCase.items.length)];
        html += `
          <div class="roulette-item">
            <div class="icon">${item.icon}</div>
            <div>${item.name}</div>
          </div>
        `;
      }
      track.innerHTML = html;
    }

    function getWeightedDrop(items) {
      const totalWeight = items.reduce((sum, item) => sum + item.weight, 0);
      let rand = Math.random() * totalWeight;
      for (let item of items) {
        if (rand < item.weight) return item;
        rand -= item.weight;
      }
      return items[0];
    }

        isSpinning = false;
        inventory.push({ ...winItem, id: Date.now() });
        alert(`🎉 Вам выпало: ${winItem.name} (${winItem.value} ⭐)!`);
      }, 4800);
    }

    function openProfile() {
      document.getElementById('invBalance').textContent = `${balance} ⭐`;
      renderInventory();
      document.getElementById('profileOverlay').style.display = 'flex';
    }

    function renderInventory() {
      const list = document.getElementById('inventoryList');
      if (inventory.length === 0) {
        list.innerHTML = `<p style="text-align:center; color:#717a8c; padding:20px;">Инвентарь пуст. Открывайте кейсы!</p>`;
        return;
      }
      list.innerHTML = inventory.map(item => `
        <div class="inv-item">
          <div class="inv-info">
            <div class="inv-icon">${item.icon}</div>
            <div>
              <div style="font-weight:700; font-size:14px;">${item.name}</div>
              <div style="font-size:12px; color:#ffb703;">${item.value} ⭐</div>
            </div>
          </div>
          <div class="inv-actions">
            <button class="btn-sell" onclick="sellItem(${item.id})">Продать</button>
            <button class="btn-withdraw" onclick="withdrawItem('${item.name}')">Вывести</button>
          </div>
        </div>
      `).join('');
    }

    function sellItem(id) {
      const idx = inventory.findIndex(x => x.id === id);
      if (idx !== -1) {
        const item = inventory[idx];
        balance += item.value;
        inventory.splice(idx, 1);
        updateBalanceDisplay();
        document.getElementById('invBalance').textContent = `${balance} ⭐`;
        renderInventory();
      }
    }

    function withdrawItem(itemName) {
      alert(`🚀 Заявка на вывод предмета "${itemName}" отправлена администратору бота!`);
    }

    async function fetchBalance() {
      try {
        const res = await fetch(`${SERVER_URL}/api/get_balance?user_id=${tgUserId}`, {
          headers: { 'ngrok-skip-browser-warning': 'true' }
        });
        const data = await res.json();
        if (data.status === 'ok') {
          balance = data.balance;
          updateBalanceDisplay();
        }
      } catch (e) { console.error(e); }
    }

    function updateBalanceDisplay() {
      document.getElementById('balanceDisplay').textContent = `${balance} ⭐`;
    }

    function openTopUpModal() { document.getElementById('topupModal').style.display = 'flex'; }
    function closeModal(id) { document.getElementById(id).style.display = 'none'; }
    function closeOverlay(id) { 
      if (!isSpinning) document.getElementById(id).style.display = 'none'; 
    }

    async function payStars(amount) {
      closeModal('topupModal');
      try {
        const response = await fetch(`${SERVER_URL}/api/create_invoice`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'ngrok-skip-browser-warning': 'true' },
          body: JSON.stringify({ amount: amount, user_id: tgUserId })
        });
        const data = await response.json();
        if (data.status === 'ok' && data.invoice_link) {
          tg.openInvoice(data.invoice_link, function(status) {
            if (status === 'paid') setTimeout(fetchBalance, 1000);
          });
        }
      } catch (e) { alert("Ошибка подключения к серверу!"); }
    }

    function payCustom() {
      const val = parseInt(document.getElementById('customAmount').value);
      if (val && val > 0) payStars(val);
    }

    renderCases();
    fetchBalance();
  </script>
</body>
</html>
