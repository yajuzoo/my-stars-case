<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Кейсы за Stars</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body {
      background-color: #1a1a24;
      color: #fff;
      font-family: sans-serif;
      text-align: center;
      padding: 20px;
    }
    h2 { color: #f39c12; }
    .btn {
      background: #f39c12;
      color: #fff;
      border: none;
      padding: 16px 32px;
      font-size: 18px;
      font-weight: bold;
      border-radius: 12px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <h2>⭐ Открытие кейса ⭐</h2>
  <p>Цена: <b>10 Stars</b></p>

  <br><br>
  <button class="btn" onclick="buyCase()">Крутить за 10 ⭐</button>

  <script>
  const tg = window.Telegram.WebApp;
  tg.expand();

  const urlParams = new URLSearchParams(window.location.search);
  const invoiceUrl = urlParams.get('invoice');

  function buyCase() {
    // Всплывающее окно покажет нам реальный URL инвойса
    alert("Ссылка на оплату: " + invoiceUrl);

    if (invoiceUrl) {
      tg.openInvoice(invoiceUrl, function(status) {
        alert("Статус оплаты: " + status);
      });
    } else {
      alert("Ошибка: Ссылка не пришла из URL!");
    }
  }
</script>
</body>
</html>
